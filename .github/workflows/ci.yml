name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Les tests unitaires ne touchent jamais le réseau, mais le client
      # Supabase exige ces variables à l'import : valeurs factices.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Même commande que Vercel : échoue si le lockfile n'est pas synchro
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # `tsc --noEmit` sur le tsconfig racine ne compile RIEN (files: [] + references)
      # et sortait toujours en succès : il faut `-b` pour traverser les sous-projets.
      - name: Typecheck
        run: npx tsc -b --force

      - name: Tests unitaires
        run: npx vitest run

      - name: Build
        run: pnpm run build

  # Règles de sécurité SQL : on rejoue dans la peau d'un membre les tentatives
  # d'escalade de privilège contre un Postgres jetable. Le script échoue aussi
  # si les tests passent SANS le correctif — un test qui ne mord sur rien ne
  # protège de rien.
  securite-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Tests des règles de sécurité
        run: ./scripts/test-sql.sh
